name: Release plane-cli

on:
  push:
    tags:
      - "plane-cli-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
            bun_target: bun-linux-x64
            smoke: true
          - runner: ubuntu-latest
            target: darwin-x64
            bun_target: bun-darwin-x64
            smoke: false
          - runner: macos-14
            target: darwin-arm64
            bun_target: bun-darwin-arm64
            smoke: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Test
        run: bun test
      - name: Build standalone executable
        run: bun build --compile --target=${{ matrix.bun_target }} --outfile dist/plane-cli src/cli.ts
      - name: Smoke test executable
        if: ${{ matrix.smoke }}
        run: ./dist/plane-cli --version
      - name: Package archive
        run: |
          mkdir -p release
          tar -C dist -czf "release/plane-cli-${{ matrix.target }}.tar.gz" plane-cli
          shasum -a 256 "release/plane-cli-${{ matrix.target }}.tar.gz" > "release/plane-cli-${{ matrix.target }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: plane-cli-${{ matrix.target }}
          path: release/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm tag matches the CLI version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#plane-cli-v}"
          version="$(jq -r .version package.json)"
          test "$tag" = "$version"
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
